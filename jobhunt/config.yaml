# jobhunt configuration
#
# Run `python -m jobhunt doctor` after editing — it pings every source and
# tells you which ones work. Workday tenants/sites occasionally move; fix the
# host/tenant/site here if doctor flags one (open the company careers page,
# watch the network tab for a `/wday/cxs/<tenant>/<site>/jobs` request).

search_queries:          # used by query-based boards (workday/eightfold/big tech)
  - asic
  - rtl
  - design verification
  - dft
  - physical design
  - firmware
  - silicon

only_new_grad: false     # true = drop postings without an explicit new-grad/early-career signal
data_dir: jobhunt-data   # state + report live here (relative to repo root)

notify:
  email_to: passsp345@gmail.com   # used when SMTP_* env vars are configured
  only_new_grad: false            # notify on every new match, not just 🎓-tagged ones

companies:
