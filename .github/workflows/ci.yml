name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Unit tests
        run: make CC=${{ matrix.cc }} test

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format clang-tidy
      - name: Format check
        run: make check-format
      - name: Tidy
        run: make tidy

  sanitizers:
    name: unit tests (${{ matrix.san }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        san: [asan, ubsan]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests under sanitizer
        run: make SAN=${{ matrix.san }} test

  integration:
    name: integration (scapy over TAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcpdump iperf3 iputils-arping traceroute
          sudo pip3 install --break-system-packages scapy pytest
      - name: Build (ASan)
        run: make SAN=asan
      - name: Run integration tests (root)
        run: |
          if ls test/integration/test_*.py >/dev/null 2>&1; then
            sudo python3 -m pytest test/integration -v --tb=short
          else
            echo "no integration tests yet"
          fi
      - name: Fuzz smoke (5k mutated frames under ASan)
        run: sudo python3 test/fuzz/fuzz_scapy.py --iterations 5000 --seed 7
      - name: Upload packet captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcaps
          path: test/artifacts/
          if-no-files-found: ignore

  coverage:
    name: coverage (gcovr)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcpdump iperf3 iputils-arping traceroute
          sudo pip3 install --break-system-packages scapy pytest gcovr
      - name: Build with coverage + unit tests
        run: |
          make COV=1
          make COV=1 test
          make COV=1 build-cov/fuzz/parse_harness
          python3 fuzz/make_corpus.py
          for f in fuzz/corpus/*.bin; do ./build-cov/fuzz/parse_harness < "$f"; done
      - name: Integration tests against the coverage build
        run: sudo env PF_BUILD=build-cov python3 -m pytest test/integration -q
      - name: Report
        run: |
          mkdir -p coverage
          gcovr -r . build-cov --filter 'src/' --print-summary \
                --html-details coverage/index.html | tee coverage/summary.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
